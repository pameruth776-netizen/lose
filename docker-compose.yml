# =============================================================================
# docker-compose.yml — Entorno de desarrollo y pruebas local
# Incluye: app Spring Boot + MySQL 8.0
#
# Uso rápido:
#   docker compose up --build          → levantar todo
#   docker compose up --build -d       → en background
#   docker compose logs -f app         → ver logs de la app
#   docker compose down -v             → apagar y eliminar volúmenes
# =============================================================================

version: "3.9"

services:

  # ─────────────────────────────────────────────
  # Base de datos MySQL 8.0
  # ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: enjambre-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: enjambre
      MYSQL_USER: ${MYSQL_USER:-enjambre_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enjambre_pass}
    ports:
      - "3306:3306"
    volumes:
      # Persistencia de datos entre reinicios
      - db_data:/var/lib/mysql
    healthcheck:
      # Esperar a que MySQL esté listo antes de iniciar la app
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - enjambre-net

  # ─────────────────────────────────────────────
  # Aplicación Spring Boot
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enjambre-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy    # Solo inicia cuando MySQL responde
    environment:
      # URL de base de datos apuntando al servicio 'db' interno de Docker
      MYSQL_URL: mysql://db:3306/enjambre
      MYSQL_USER: ${MYSQL_USER:-enjambre_user}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-enjambre_pass}
      # Credenciales de correo (opcionales; la app funciona sin ellas)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_EMAIL_FROM: ${BREVO_EMAIL_FROM:-countercito10@gmail.com}
      # Puerto y JVM
      PORT: 8080
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      # Carpeta para archivos subidos (si la app los guarda localmente)
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null || wget -qO- http://localhost:8080/ 2>/dev/null | grep -q '.' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - enjambre-net

# ─────────────────────────────────────────────
# Volúmenes nombrados (persisten entre 'docker compose down')
# ─────────────────────────────────────────────
volumes:
  db_data:
    name: enjambre_db_data
  uploads:
    name: enjambre_uploads

# ─────────────────────────────────────────────
# Red interna para comunicación entre servicios
# ─────────────────────────────────────────────
networks:
  enjambre-net:
    name: enjambre-network
    driver: bridge
