# =============================================================================
# GitHub Actions — CI/CD Pipeline para Enjambre (Spring Boot + Docker)
#
# Pipeline de 3 etapas:
#   1. test    → Ejecuta los tests con H2 en memoria (sin MySQL)
#   2. build   → Compila el JAR y construye la imagen Docker
#   3. publish → (Opcional) Publica la imagen en Docker Hub si hay credenciales
#
# Secrets requeridos en GitHub (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  → Tu usuario de Docker Hub
#   DOCKERHUB_TOKEN     → Token de acceso de Docker Hub (no la contraseña)
#
# El job "publish" se omite automáticamente si no existen esos secrets.
# =============================================================================

name: CI/CD — Enjambre

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancelar runs previos del mismo PR/branch para ahorrar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: enjambre-app
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: TEST
  # Ejecuta los tests unitarios/integración con base de datos H2
  # en memoria para no depender de MySQL en CI.
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests con H2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Ejecutar tests (H2 en memoria)
        run: mvn -B test --file pom.xml
        env:
          # Variables de entorno con valores ficticios para que el contexto
          # de Spring Boot levante correctamente durante los tests.
          # Los tests usan H2 (src/test/resources/application.properties).
          BREVO_API_KEY: test-key-ci
          BREVO_EMAIL_FROM: ci@redsolidaria.pe

      - name: Publicar reporte de tests (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: BUILD JAR + IMAGEN DOCKER
  # Solo corre si los tests pasaron. Construye el JAR y la imagen
  # Docker multi-etapa, y verifica que el contenedor arranque.
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build JAR + Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compilar JAR (sin tests, ya se ejecutaron)
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Verificar que el JAR existe
        run: ls -lh target/*.jar

      - name: Configurar Docker Buildx (build multi-plataforma)
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (solo build, sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          # Usar caché de GitHub Actions para acelerar builds Docker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar que la imagen arranca correctamente
        run: |
          echo "▶ Iniciando contenedor de prueba (sin MySQL, solo startup check)..."
          docker run -d \
            --name enjambre-test \
            -e BREVO_API_KEY=test \
            -e BREVO_EMAIL_FROM=ci@test.com \
            -e MYSQL_URL=mysql://localhost:3306/test \
            -e MYSQL_USER=root \
            -e MYSQL_ROOT_PASSWORD=pass \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:test || true

          echo "⏳ Esperando 20 segundos para inicio..."
          sleep 20

          echo "📋 Logs del contenedor:"
          docker logs enjambre-test || true

          echo "🧹 Limpiando contenedor de prueba..."
          docker stop enjambre-test || true
          docker rm enjambre-test || true

      - name: Subir JAR como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: enjambre-jar-${{ github.sha }}
          path: target/*.jar
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 3: PUBLISH (Opcional — solo en push a main)
  # Publica la imagen en Docker Hub si los secrets están configurados.
  # Para activarlo: configurar DOCKERHUB_USERNAME y DOCKERHUB_TOKEN
  # en Settings → Secrets and variables → Actions de tu repositorio.
  # ─────────────────────────────────────────────────────────────
  publish:
    name: 📦 Publicar en Docker Hub
    runs-on: ubuntu-latest
    needs: build
    # Solo ejecutar en push a main (no en PRs) y si los secrets existen
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.DOCKERHUB_USERNAME != '' &&
      vars.DOCKERHUB_USERNAME != ''
    environment:
      name: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compilar JAR
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos de la imagen (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag "latest" para la rama main
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag con el SHA del commit (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-
            # Tag semver si se usan git tags (e.g. v1.2.3 → 1.2.3)
            type=semver,pattern={{version}}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
